name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Android arm64 binary
        run: |
          VERSION=2.4.16
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 -o app/src/main/assets/tnd \
            "https://github.com/zhongbai2333/Tomato-Novel-Downloader/releases/download/v${VERSION}/TomatoNovelDownloader-Android_arm64-v${VERSION}"
          chmod +x app/src/main/assets/tnd
          ls -l app/src/main/assets/tnd
          test -s app/src/main/assets/tnd

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomato-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest -t "番茄 APK（最新构建）" -n "由 GitHub Actions 自动构建，每次推送覆盖。"
          gh release upload apk-latest app/build/outputs/apk/debug/app-debug.apk --clobber
